<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">Receiver-led gentle finger movement</title>
  <desc id="desc">Two clear palm-up hand diagrams show a supported, relaxed index finger and then the recipient gently straightening that finger themselves. The practitioner does not grasp or pull the finger.</desc>
  <defs>
    <marker id="move-arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 17 9 1 17z" fill="#a84838" stroke="#fff" stroke-width="2"/>
    </marker>
    <style>
      .panel { fill: #fffefa; stroke: #d9dfd5; stroke-width: 3; }
      .heading { fill: #193b30; font: 700 44px system-ui, sans-serif; letter-spacing: 1px; }
      .subheading { fill: #435b50; font: 600 30px system-ui, sans-serif; }
      .skin { fill: #edc1ac; stroke: #705244; stroke-width: 6; stroke-linejoin: round; }
      .moving { fill: #d99576; stroke: #705244; stroke-width: 7; stroke-linejoin: round; }
      .joint { fill: none; stroke: #bd8a73; stroke-width: 4; stroke-linecap: round; }
      .palm-line { fill: none; stroke: #c9957e; stroke-width: 4; stroke-linecap: round; opacity: .8; }
    </style>
  </defs>
  <rect width="1448" height="1086" fill="#f4f2eb"/>
  <rect class="panel" x="32" y="28" width="674" height="1030" rx="24"/>
