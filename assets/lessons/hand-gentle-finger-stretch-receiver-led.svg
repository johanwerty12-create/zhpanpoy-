  <text class="heading" x="70" y="88">01 · START</text>
  <text class="subheading" x="70" y="124">Let one finger rest easily.</text>
  <text class="heading" x="780" y="88">02 · RECIPIENT MOVES</text>
  <text class="subheading" x="780" y="124">They straighten within comfort.</text>

