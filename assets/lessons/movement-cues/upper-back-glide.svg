<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">Upper-back gliding direction</title>
  <desc id="desc">Two broad paths travel up and outward toward the shoulders, staying clear of the spine and neck.</desc>
  <defs><marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 17 9 1 17z" fill="#8c3b2e" stroke="#fff" stroke-width="2"/></marker></defs>
  <path d="M360 470 C350 425 337 382 318 340 M640 470 C650 425 663 382 682 340" fill="none" stroke="#14251c" stroke-width="18" stroke-linecap="round" opacity=".76"/>
  <path d="M360 470 C350 425 337 382 318 340 M640 470 C650 425 663 382 682 340" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
