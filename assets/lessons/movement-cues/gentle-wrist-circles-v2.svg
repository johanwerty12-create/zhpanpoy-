<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">Gentle wrist-circle movement</title>
  <desc id="desc">A small clockwise cue circles the two fingertip pads at their contact on soft skin just above the wrist crease, without moving the wrist joint.</desc>
  <defs><marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 17 9 1 17z" fill="#8c3b2e" stroke="#fff" stroke-width="2"/></marker></defs>
  <path d="M487 304 A34 34 0 0 1 487 236 A34 34 0 0 1 487 304" fill="none" stroke="#14251c" stroke-width="18" stroke-linecap="round" opacity=".76"/>
  <path d="M487 304 A34 34 0 0 1 487 236 A34 34 0 0 1 487 304" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
