<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">Gentle scalp-gliding direction</title>
  <desc id="desc">Soft finger pads travel from the hairline toward the crown without tugging the hair or moving the head.</desc>
  <defs><marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 17 9 1 17z" fill="#8c3b2e" stroke="#fff" stroke-width="2"/></marker></defs>
  <path d="M362 316 C357 275 352 233 348 190 M638 316 C643 275 648 233 652 190" fill="none" stroke="#14251c" stroke-width="18" stroke-linecap="round" opacity=".76"/>
  <path d="M362 316 C357 275 352 233 348 190 M638 316 C643 275 648 233 652 190" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
