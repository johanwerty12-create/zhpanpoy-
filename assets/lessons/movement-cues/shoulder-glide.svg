  <path d="M485 430 C430 424 370 420 310 416 M565 430 C625 424 690 420 755 416" fill="none" stroke="#14251c" stroke-width="18" stroke-linecap="round" opacity=".76"/>
  <path d="M485 430 C430 424 370 420 310 416 M565 430 C625 424 690 420 755 416" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
